name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv sync --all-extras

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      # Unit tests only. The benchmark runs a real pytest suite thirty-odd times and
      # deliberately contains clock- and hash-dependent tests, so it is run by hand and
      # its numbers recorded in docs/RESULTS.md rather than gated on here.
      - name: Test
        run: uv run pytest -q
