[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flake-detective"
version = "0.1.0"
description = "Find flaky tests and say what they depend on - order, hash seed, clock, or nothing at all"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "hammasbuilds" }]
keywords = ["flaky tests", "pytest", "test isolation", "determinism", "ci", "test ordering"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
# No runtime dependencies. pytest is invoked as a subprocess in the repo under
# investigation, using that repo's own interpreter environment - not imported here.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
flake-detective = "flake_detective.cli:main"

[project.urls]
Homepage = "https://github.com/hammasbuilds/flake-detective"
Source = "https://github.com/hammasbuilds/flake-detective"
Issues = "https://github.com/hammasbuilds/flake-detective/issues"
Changelog = "https://github.com/hammasbuilds/flake-detective/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/flake_detective"]
# py.typed is empty and has no extension, which is exactly the sort of file
# a build backend drops. Without it in the wheel, mypy and pyright ignore
# every annotation in this package and hand callers `Any` - PEP 561 needs
# the marker shipped, not just the hints written.
artifacts = ["src/flake_detective/py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
